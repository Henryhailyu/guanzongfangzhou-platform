services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: guanlian_db
      MYSQL_USER: guanlian_user
      MYSQL_PASSWORD: dev-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - guanlian

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - guanlian

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - guanlian

  backend:
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      DB_HOST: mysql
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongodb:27017/guanlian_questions

volumes:
  mysql_data:
  mongo_data:
